name: My First Workflow

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: |
          if [ -f index.html ]; then
            echo "Success: index.html exists"
          else
            echo "Error: index.html is missing"
            exit 1
          fi

      - name: Check required text
        run: |
          if grep -q "welcome to my website" index.html; then
            echo "Success: Hello World text found"
          else
            echo "Error: Hello World text not found"
            exit 1
          fi
