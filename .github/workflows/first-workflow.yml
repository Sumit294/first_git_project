name: My First Workflow

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check index.html
        run: |
          if [ -f index.html ]; then
            echo "Success: index.html exists"
          else
            echo "Error: index.html is missing"
            exit 1
          fi

        - name: check the required text
          run: |
             if grep -q "MY first Git project" index.html; then
                  echo "Success: the text is found"
              else
                   echo "ERROR: the text is not found"
                   exit 1
                 fi
